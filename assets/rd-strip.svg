<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 84" width="900" height="84" role="img" aria-label="Core Focus and R&amp;D Pillars">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .item-title { fill: #1f2328; font-size: 14px; font-weight: 700; }
      .item-sub { fill: #656d76; font-size: 12px; font-weight: 400; }
      @media (prefers-color-scheme: dark) {
        .item-title { fill: #e6edf3; }
        .item-sub { fill: #8b949e; }
      }
    </style>
  </defs>

  <!-- Item 1: Industrial Software & SCADA -->
  <g transform="translate(14, 16)">
    <rect x="0" y="0" width="46" height="46" rx="11" fill="#111111"/>
    <rect x="11" y="13" width="24" height="16" rx="2.5" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M15 24 L20 19 L24 22 L31 16" fill="none" stroke="#888888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="18" y1="34" x2="28" y2="34" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="58" y="20" class="sans item-title">Industrial Systems</text>
    <text x="58" y="38" class="sans item-sub">Mining, SaaS &amp; SCADA</text>
  </g>

  <!-- Item 2: AI & Voice Agents -->
  <g transform="translate(242, 16)">
    <rect x="0" y="0" width="46" height="46" rx="11" fill="#111111"/>
    <circle cx="17" cy="18" r="3" fill="#ffffff"/>
    <circle cx="29" cy="18" r="3" fill="#ffffff"/>
    <circle cx="23" cy="30" r="3" fill="#ffffff"/>
    <line x1="19" y1="20" x2="22" y2="28" stroke="#888888" stroke-width="1.8"/>
    <line x1="27" y1="20" x2="24" y2="28" stroke="#888888" stroke-width="1.8"/>
    <line x1="20" y1="18" x2="26" y2="18" stroke="#888888" stroke-width="1.8"/>
    <text x="58" y="20" class="sans item-title">AI &amp; Voice Agents</text>
    <text x="58" y="38" class="sans item-sub">RAG, NLP &amp; Speech AI</text>
  </g>

  <!-- Item 3: Autonomous LiDAR -->
  <g transform="translate(470, 16)">
    <rect x="0" y="0" width="46" height="46" rx="11" fill="#111111"/>
    <circle cx="23" cy="23" r="13" fill="none" stroke="#555555" stroke-width="1.5"/>
    <circle cx="23" cy="23" r="8" fill="none" stroke="#aaaaaa" stroke-width="1.5"/>
    <circle cx="23" cy="23" r="3" fill="#ffffff"/>
    <line x1="23" y1="23" x2="33" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="58" y="20" class="sans item-title">Autonomous LiDAR</text>
    <text x="58" y="38" class="sans item-sub">Radar/LiDAR for Africa</text>
  </g>

  <!-- Item 4: Wave Energy -->
  <g transform="translate(696, 16)">
    <rect x="0" y="0" width="46" height="46" rx="11" fill="#111111"/>
    <path d="M10 26 Q 16 18, 23 26 T 36 26" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M10 33 Q 16 25, 23 33 T 36 33" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
    <path d="M24 10 L 20 18 L 24 18 L 22 23" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="20" class="sans item-title">Wave Energy</text>
    <text x="58" y="38" class="sans item-sub">Coastal Power R&amp;D</text>
  </g>
</svg>
