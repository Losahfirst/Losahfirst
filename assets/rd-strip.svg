<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 84" width="900" height="84" role="img" aria-label="Currently Building and R&amp;D">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .item-title { fill: #1f2328; font-size: 14px; font-weight: 700; }
      .item-sub { fill: #656d76; font-size: 12px; font-weight: 400; }
      @media (prefers-color-scheme: dark) {
        .item-title { fill: #e6edf3; }
        .item-sub { fill: #8b949e; }
      }
    </style>
  </defs>

  <!-- Item 1: Hubble Sat-IoT -->
  <g transform="translate(18, 16)">
    <rect x="0" y="0" width="46" height="46" rx="11" fill="#111111"/>
    <circle cx="23" cy="23" r="4" fill="#ffffff"/>
    <path d="M15 15 A 11 11 0 0 1 31 15" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M11 11 A 17 17 0 0 1 35 11" fill="none" stroke="#888888" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="23" y1="27" x2="23" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="58" y="20" class="sans item-title">Bluetooth → Satellite</text>
    <text x="58" y="38" class="sans item-sub">ESP32-C6 &amp; Hubble IoT</text>
  </g>

  <!-- Item 2: Autonomous LiDAR -->
  <g transform="translate(245, 16)">
    <rect x="0" y="0" width="46" height="46" rx="11" fill="#111111"/>
    <circle cx="23" cy="23" r="13" fill="none" stroke="#555555" stroke-width="1.5"/>
    <circle cx="23" cy="23" r="8" fill="none" stroke="#aaaaaa" stroke-width="1.5"/>
    <circle cx="23" cy="23" r="3" fill="#ffffff"/>
    <line x1="23" y1="23" x2="33" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="58" y="20" class="sans item-title">Autonomous LiDAR</text>
    <text x="58" y="38" class="sans item-sub">Radar/LiDAR for Africa</text>
  </g>

  <!-- Item 3: Wave Energy -->
  <g transform="translate(472, 16)">
    <rect x="0" y="0" width="46" height="46" rx="11" fill="#111111"/>
    <path d="M10 26 Q 16 18, 23 26 T 36 26" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M10 33 Q 16 25, 23 33 T 36 33" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
    <path d="M24 10 L 20 18 L 24 18 L 22 23" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="20" class="sans item-title">Wave Energy</text>
    <text x="58" y="38" class="sans item-sub">Coastal Power R&amp;D</text>
  </g>

  <!-- Item 4: ECOBIN+ -->
  <g transform="translate(692, 16)">
    <rect x="0" y="0" width="46" height="46" rx="11" fill="#111111"/>
    <rect x="14" y="16" width="18" height="20" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="11" y1="16" x2="35" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M19 16 V 13 A 2 2 0 0 1 21 11 H 25 A 2 2 0 0 1 27 13 V 16" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <circle cx="23" cy="26" r="3" fill="#ffffff"/>
    <text x="58" y="20" class="sans item-title">ECOBIN+</text>
    <text x="58" y="38" class="sans item-sub">Smart Waste IoT</text>
  </g>
</svg>
